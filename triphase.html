<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculateur Triphasé</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    color:white;

    background:
    linear-gradient(
        rgba(0,0,0,0.7),
        rgba(0,0,0,0.7)
    ),
    url("https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=1900&q=80");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.container{

    max-width:1000px;
    margin:auto;
    padding:30px;
}

.card{

    background:rgba(255,255,255,0.10);

    backdrop-filter:blur(12px);

    border-radius:20px;

    padding:30px;
}

h1{

    text-align:center;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:20px;
}

.field{

    display:flex;
    flex-direction:column;
}

label{

    margin-bottom:5px;
}

input{

    padding:10px;
    border:none;
    border-radius:8px;
}

button{

    padding:14px;
    margin-top:25px;

    width:100%;

    border:none;

    border-radius:10px;

    background:#0094ff;

    color:white;

    font-size:18px;

    cursor:pointer;
}

button:hover{

    background:#0070c0;
}

.resultats{

    margin-top:30px;
}

.result{

    padding:12px;

    background:rgba(255,255,255,0.15);

    margin-bottom:10px;

    border-radius:8px;

    font-size:20px;
}

.menu{

    margin-bottom:20px;
}

.menu a{

    color:white;

    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<div class="menu">

<a href="index.html">
⬅ Retour au portail
</a>

</div>

<div class="card">

<h1>Calculateur Triphasé</h1>

<div class="grid">

<div class="field">
<label>Tension ligne-ligne (V)</label>
<input id="v" value="600">
</div>

<div class="field">
<label>Puissance active (kW)</label>
<input id="kw" value="1000">
</div>

<div class="field">
<label>Facteur de puissance</label>
<input id="pf" value="0.95">
</div>

</div>

<button onclick="calculer()">
Calculer
</button>

<div class="resultats">

<div class="result" id="kvaResult">
kVA :
</div>

<div class="result" id="currentResult">
Courant :
</div>

<div class="result" id="mwResult">
MW :
</div>

<div class="result" id="mvaResult">
MVA :
</div>

<div class="result" id="kvarResult">
kVAR :
</div>

</div>

</div>

</div>

<script>

const savedBackground =
localStorage.getItem(
"jsb-background-image"
);

if(savedBackground){

document.body.style.backgroundImage =
"linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)), url('" +
savedBackground +
"')";

}

function calculer(){

let V =
parseFloat(
document.getElementById("v").value
);

let kW =
parseFloat(
document.getElementById("kw").value
);

let PF =
parseFloat(
document.getElementById("pf").value
);

let kVA =
kW/PF;

let courant =
(kVA*1000) /
(1.732*V);

let MW =
kW/1000;

let MVA =
kVA/1000;

let kvar =
Math.sqrt(
(kVA*kVA) -
(kW*kW)
);

document.getElementById(
"kvaResult"
).innerHTML =
"kVA : " +
kVA.toFixed(2);

document.getElementById(
"currentResult"
).innerHTML =
"Courant : " +
courant.toFixed(1) +
" A";

document.getElementById(
"mwResult"
).innerHTML =
"MW : " +
MW.toFixed(4);

document.getElementById(
"mvaResult"
).innerHTML =
"MVA : " +
MVA.toFixed(4);

document.getElementById(
"kvarResult"
).innerHTML =
"kVAR : " +
kvar.toFixed(2);

}

calculer();

</script>

</body>
</html>
